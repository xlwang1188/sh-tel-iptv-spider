# RTP2HTTPD Configuration for Shanghai Telecom IPTV
# 上海电信 IPTV 专网 RTP/RTSP 组播转 HTTP 单播代理配置

[global]
# 日志级别: 0-quiet 1-error 2-warn 3-info 4-debug
verbosity = 3

# 保持与 udpxy URL 路径兼容 (支持 /rtp/ 与 /udp/)
udpxy = yes

# 状态页面与网页播放器路径
status-page-path = /status
player-page-path = /player

# 上游专网网卡接口配置 (绑定电信 IPTV 网卡 eth0.85)
# 优先级高于系统路由表，确保组播 IGMP 加入与接收固定走 IPTV 接口
upstream-interface-multicast = eth0.85
upstream-interface-rtsp = eth0.85
upstream-interface-http = eth0.85

# 自动同步外置 M3U 播放列表 (由 iptv-spider 动态生成)
external-m3u = http://127.0.0.1:8888/api/m3u8
external-m3u-update-interval = 7200

# 内存缓冲池大小 (32768 * 1536 字节 = 48MB 内存缓冲区)
# 增强多客户端并发发流吞吐量
buffer-pool-max-size = 32768

# UDP 套接字接收缓冲区 (4MB，防止 4K 频道瞬时码率突发丢包)
# 建议在系统 sysctl 中配合设置 net.core.rmem_max >= 4194304
udp-rcvbuf-size = 4194304

# RTSP 客户端 User-Agent (模拟电信机顶盒)
rtsp-user-agent = IPTV_STB

[bind]
# 监听端口配置 (默认监听在全部网络接口的 5140 端口)
* 5140
