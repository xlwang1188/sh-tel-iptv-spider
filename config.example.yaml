  name_sequence: 
    - name: "CCTV-4K"
    - name: "CCTV16-4K"
    - name: "东方卫视4K"
    - name: "北京卫视4K"
    - name: "江苏卫视4K"
    - name: "浙江卫视4K"
    - name: "湖南卫视4K"
    - name: "广东卫视4K"
    - name: "深圳卫视4K"
    - name: "山东卫视4K"
    - name: "四川卫视4K"
    - name: "欢笑剧场4K"
    - name: "BesTV4K电影"
    - name: "BesTV4K动画"
    - name: "BesTV4K记录"

cache:
  type: memory
  prefix: 'CM'
  memory_interval: 60
  default_timeout: 240

zap:
  level: 'info'
  format: 'console'
  prefix: '[iptv-spider-sh]'
  director: 'log'
  link-name: 'latest_log'
  show-line: false
  encode-level: 'LowercaseColorLevelEncoder'
  stacktrace-key: 'stacktrace'
  log-in-console: true
