      name: "江苏卫视4K"
      logo: "江苏卫视4K.png"
      group: "4K频道"
    - id: '148'
      igmp: 'igmp://233.18.204.228:5140'
      name: "山东卫视4K"
      logo: "山东卫视4K.png"
      group: "4K频道"
    - id: '146'
      igmp: 'igmp://233.18.204.219:5140'
      name: "深圳卫视4K"
